<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="239px" height="262px" viewBox="-0.5 -0.5 239 262">
    <title>Two boxes, each labelled with one kind of complexity and containing a smaller box labelled with the other</title>
    <defs/>
    <g>
        <rect x="1" y="1" width="120" height="120" fill="var(--base-page, #ffffff)" stroke="currentColor" stroke-width="2" pointer-events="all"/>
        <text x="61" y="16" text-anchor="middle" dominant-baseline="hanging" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="61" dy="0">Essential</tspan>
            <tspan x="61" dy="16">Complexity</tspan>
        </text>
        <rect x="71" y="71" width="40" height="40" fill="currentColor" stroke="currentColor" pointer-events="all"/>
        <path d="M 161 91 L 111 91" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-dasharray="1 2" pointer-events="stroke"/>
        <text x="201" y="91" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="201" dy="-8">Accidental</tspan>
            <tspan x="201" dy="16">Complexity</tspan>
        </text>
        <rect x="1" y="141" width="120" height="120" fill="currentColor" stroke="currentColor" stroke-width="2" pointer-events="all"/>
        <text x="61" y="156" text-anchor="middle" dominant-baseline="hanging" font-size="14" font-family="inherit" font-weight="bold" fill="var(--base-page, #ffffff)">
            <tspan x="61" dy="0">Accidental</tspan>
            <tspan x="61" dy="16">Complexity</tspan>
        </text>
        <rect x="71" y="211" width="40" height="40" fill="var(--base-page, #ffffff)" stroke="currentColor" pointer-events="all"/>
        <path d="M 161 231 L 121 231" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-dasharray="1 2" pointer-events="stroke"/>
        <text x="201" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="inherit" font-weight="bold" fill="currentColor">
            <tspan x="201" dy="-8">Essential</tspan>
            <tspan x="201" dy="16">Complexity</tspan>
        </text>
        <path d="M 121 231 L 111 231" fill="none" stroke="var(--base-page, #ffffff)" stroke-miterlimit="10" stroke-dasharray="1 2" pointer-events="stroke"/>
    </g>
